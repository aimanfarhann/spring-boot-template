# Local development. Defaults match docker-compose.yml so the app runs with zero setup;
# override any of them with environment variables.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/app}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app}

logging:
  level:
    com.example.template: DEBUG
    org.hibernate.SQL: DEBUG
